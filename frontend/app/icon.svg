  <title id="title">Sidira</title>
  <desc id="desc">Sidira mark — six-blade diaphragm. Duo-color strokes on paper ground. Geometry matches sidira-mark.svg; stroke is calibrated for 32–144px render sizes (the favicon + Next.js app-icon size range).</desc>
