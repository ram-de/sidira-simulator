      <polygon points="15.359,70 15.359,30 38.740,43.5 38.740,56.5"/>
      <polygon points="15.359,30 50,10 50,37 38.740,43.5"/>
    </g>
    <g stroke="#D696C8">
      <polygon points="84.641,70 50,90 50,63 61.260,56.5"/>
