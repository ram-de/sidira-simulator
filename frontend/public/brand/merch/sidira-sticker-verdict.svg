<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 104" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Sidira sticker · verdict chip with decision policy (ink on paper)</title>
  <desc id="desc">Rectangular sticker, 84 × 31 mm, radius 4. The §8.1 decision-rule primitive as a physical object: the MVP verdict lexicon stem with its policy beside it. A verdict without its policy never renders, including on a laptop lid. Ink on paper, single-color print. Text converts to outlines before production. The outer rounded rect is the cut path.</desc>
  <!-- cut path = outer rect -->
  <rect x="0.5" y="0.5" width="279" height="103" rx="4" fill="#F4EFE6" stroke="#0E1A2B" stroke-opacity="0.35" stroke-width="0.75"/>

  <text x="16" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700"
        font-size="10" letter-spacing="0.3" fill="#0E1A2B">HIGH SIM AGREEMENT · SHIP CANDIDATE</text>

  <line x1="16" y1="36" x2="264" y2="36" stroke="#0E1A2B" stroke-opacity="0.35" stroke-width="0.5"/>

  <text x="16" y="54" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500"
        font-size="8.5" fill="#0E1A2B">SHIP IF P ≥ 0.70 AND EVERY HIGH RISK</text>
  <text x="16" y="66" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500"
        font-size="8.5" fill="#0E1A2B">HAS A NAMED MITIGATION</text>

  <text x="16" y="90" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="400"
        font-size="6" letter-spacing="0.4" fill="#4A5668">THRESHOLD 0.70 · POLICY DR-1 · MARGIN +0.08</text>
  <text x="264" y="90" font-family="'Archivo Narrow', 'Archivo', sans-serif" font-weight="600"
        font-size="7.5" letter-spacing="0.8" text-anchor="end" fill="#0E1A2B">SIDIRA</text>
</svg>
