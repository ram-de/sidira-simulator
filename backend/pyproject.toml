[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia-simulator"
version = "0.1.0"
description = "Pythia simulation backend — API, simulation orchestration, and agent chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.25",
    "openai>=1.30",
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "ipykernel",
]

[project.scripts]
pythia-simulator = "pythia_simulator.cli:cli"

[tool.setuptools.packages.find]
include = ["pythia_simulator*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
