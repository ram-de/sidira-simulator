[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidira-simulator"
version = "0.1.0"
description = "Sidira simulation backend — API, simulation orchestration, and agent chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.25",
    "openai>=2.0",
    "clerk-backend-api>=5.0",
    "svix>=1.40",
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "click>=8.1",
    "cryptography>=42.0",
    "snowflake-connector-python>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "ipykernel",
]

[project.scripts]
sidira-simulator = "sidira_simulator.cli:cli"
# Temporary pre-launch compatibility for existing developer virtualenvs.
pythia-simulator = "sidira_simulator.cli:cli"

[tool.setuptools.packages.find]
include = ["sidira_simulator*"]

[tool.setuptools.package-data]
# Bundled Persona Pack JSON is application data loaded at runtime via
# Path(__file__).with_name(...); ship it in wheels/sdists so non-editable
# installs don't FileNotFoundError. starter_persona_pack.json is the generic
# starter served to empty tenants (#212); upworthy_general_panel_v1.json is the
# pre-registered Upworthy CTR-benchmark panel (#222); hillstrom_panel_v1.json is
# the real v1.1 Hillstrom email-uplift directional-benchmark panel (#222 PR-B).
sidira_simulator = [
    "adapters/starter_persona_pack.json",
    "adapters/upworthy_general_panel_v1.json",
    "adapters/hillstrom_panel_v1.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
