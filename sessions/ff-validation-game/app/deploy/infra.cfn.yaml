AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ff-validation-game minimal infra — a single t4g.small EC2 (Amazon Linux 2023,
  arm64) with a durable EBS data volume mounted at /data for SQLite, plus a
  locked-down security group. CloudFront + ACM TLS are set up separately (they
  span regions / need DNS validation — see DEPLOY.md §5).

  This is an OPTIONAL convenience: the equivalent CLI steps are in DEPLOY.md.
  Nothing here is applied automatically — `aws cloudformation deploy` is a
  founder-run step with the founder's creds.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH.
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH (your IP /32 — do NOT use 0.0.0.0/0).
    Default: 127.0.0.1/32
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for the instance.
  LatestAl2023Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Resolved Amazon Linux 2023 arm64 AMI via SSM public parameter.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ff-validation-game origin SG
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # 443 in from anywhere — CloudFront fetches the origin over HTTPS.
        # (For tighter posture, restrict to the CloudFront managed prefix list.)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        # SSH restricted to your IP only.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    Properties:
      Size: 8
      VolumeType: gp3
      AvailabilityZone: !GetAtt AppInstance.AvailabilityZone
      Tags:
        - Key: Name
          Value: ff-validation-game-data

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref AppInstance
      VolumeId: !Ref DataVolume

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      ImageId: !Ref LatestAl2023Ami
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: ff-validation-game
      # NOTE: the EBS data volume is attached but NOT formatted/mounted here —
      # DEPLOY.md §3 walks the one-time mkfs + /etc/fstab step (formatting in
      # UserData risks wiping data on an instance replace).

Outputs:
  InstanceId:
    Value: !Ref AppInstance
  PublicDns:
    Description: Set this as the CloudFront custom origin (DEPLOY.md §5).
    Value: !GetAtt AppInstance.PublicDnsName
  DataVolumeId:
    Value: !Ref DataVolume
